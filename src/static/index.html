<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-title">
        <h1>Mergington High School</h1>
        <h2>Extracurricular Activities</h2>
      </div>
      <button id="staff-auth-button" class="staff-auth-button" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z" />
        </svg>
        <span id="staff-auth-label">Teacher login</span>
      </button>
    </header>

    <dialog id="staff-login-dialog" aria-labelledby="staff-login-title">
      <form id="staff-login-form">
        <h2 id="staff-login-title">Teacher sign in</h2>
        <div class="form-group">
          <label for="staff-username">Username</label>
          <input id="staff-username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="staff-password">Password</label>
          <input id="staff-password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p id="staff-login-error" class="login-error" role="alert"></p>
        <div class="dialog-actions">
          <button id="staff-login-cancel" class="secondary-button" type="button">Cancel</button>
          <button type="submit">Sign in</button>
        </div>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" hidden>
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
